<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Reporte de ventas · 30X</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0A0A0A;--card:#141414;--card2:#1A1A1A;--line:rgba(255,255,255,.09);--fg:#fff;--mut:rgba(255,255,255,.55);--dim:rgba(255,255,255,.32);--lime:#E9FF7B;--sm:#9AA0FF;--red:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 72px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.k{font-weight:600;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
h1{font-weight:600;font-size:clamp(30px,5.4vw,52px);line-height:1.02;letter-spacing:-.04em;margin-top:14px;max-width:18ch}
h1 em{font-style:normal;color:var(--lime)}
.sub{color:var(--mut);font-size:14px;margin-top:12px}
svg.logo{width:86px;height:30px;fill:#fff}
section{margin-top:36px}
h2{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.pn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%}
.big{font-size:40px;font-weight:600;letter-spacing:-.035em;margin-top:14px}
.big small{font-size:15px;color:var(--mut);font-weight:500;letter-spacing:0;margin-left:6px}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;margin:14px 0 4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.55)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:16px}
.kv div span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kv div strong{display:block;font-size:18px;font-weight:600;margin-top:4px}
.kv div em{font-style:normal;font-size:12px;color:var(--dim)}
.s{font-size:12.5px;color:var(--mut)}
.hl{border-color:rgba(233,255,123,.35)}
.st b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:8px}
.st span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.chart{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{text-align:right;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.fut td{color:var(--dim)}
.tw{overflow-x:auto}
.up{color:var(--lime)}.dn{color:var(--red)}
.leg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-bottom:10px;flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:6px}
ul.acl{list-style:none;padding:0;display:grid;gap:10px}
ul.acl li{background:var(--card2);border-left:2px solid var(--lime);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.85)}
.foot{color:var(--dim);font-size:12px;margin-top:28px;line-height:1.6}
#lock{max-width:520px;margin:18vh auto;text-align:center;color:var(--mut);padding:0 16px}
</style></head><body>

const usd=v=>'USD '+Math.round(v).toLocaleString('es-CO');
const k0=v=>v>=1000?(v/1000).toLocaleString('es-CO',{maximumFractionDigits:1})+'k':Math.round(v);
const COL={'AI Sales':'var(--lime)','Sales Machine':'var(--sm)'};
(async()=>{try{
 const k=new URLSearchParams(location.hash.slice(1)).get('k'); if(!k) return;
 const raw=b64(P),key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
 const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12))));
 document.getElementById('lock').hidden=true; const a=document.getElementById('app'); a.hidden=false; a.innerHTML=render(d);
}catch(e){document.querySelector('#lock p').textContent='El link no es válido o está incompleto.'}})();
function chart(d){
 const W=980,H=230,pb=34,pt=16,n=d.diario.length,bw=W/n,mx=Math.max(1,...d.diario.map(x=>d.P.reduce((s,p)=>s+x[p],0)),d.tot.meta/n*1.15);
 const y=v=>H-pb-(v/mx)*(H-pb-pt); let s='';
 d.diario.forEach((x,i)=>{let acc=0;const cx=i*bw+bw*.18,w=bw*.64;
  d.P.forEach(p=>{if(x[p]>0){const h=(H-pb-pt)*(x[p]/mx);s+=`<rect x="${cx}" y="${y(acc+x[p])}" width="${w}" height="${h}" rx="3" fill="${COL[p]}"/>`;}acc+=x[p];});
  if(acc>0)s+=`<text x="${cx+w/2}" y="${y(acc)-5}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)">${k0(acc)}</text>`;
  s+=`<text x="${cx+w/2}" y="${H-18}" text-anchor="middle" font-size="10.5" fill="${x.fut?'rgba(255,255,255,.25)':'rgba(255,255,255,.6)'}">${x.d}</text><text x="${cx+w/2}" y="${H-5}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.3)">${x.w}</text>`;});
 const r=y(d.tot.meta/n); s+=`<line x1="0" x2="${W}" y1="${r}" y2="${r}" stroke="rgba(255,255,255,.4)" stroke-dasharray="4 5"/><text x="${W-4}" y="${r-6}" text-anchor="end" font-size="10.5" fill="rgba(255,255,255,.6)">ritmo para la meta · ${k0(d.tot.meta/n)}/día</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:640px;display:block">${s}</svg>`;}
function pctf(v){return v==null?'—':Math.round(v*100)+'%'}
function xf(v){return v==null?'—':v.toFixed(1).replace('.',',')+'x'}
function adsSec(d){const a=d.ads;
 const card=x=>`<div class="c"><div class="pn"><span class="dot" style="background:${COL[x.p]}"></span>${x.p} · pauta y embudo</div>
 <div class="kv"><div><span>Inversión Meta</span><strong>${usd(x.gasto)}</strong><em>en el mes</em></div>
 <div><span>Agendas</span><strong>${x.agendas}</strong><em>costo por agenda ${x.cpa?usd(x.cpa):'—'}</em></div>
 <div><span>Show-up</span><strong>${pctf(x.showup)}</strong><em>${x.atendidas??'—'} reuniones atendidas</em></div>
 <div><span>Cierre sobre atendidas</span><strong>${pctf(x.cierre)}</strong><em>${x.ventas_paid??'—'} ventas por pauta</em></div>
 <div><span>ROAS</span><strong class="${x.roas>=3?'up':x.roas!=null&&x.roas<2?'dn':''}">${xf(x.roas)}</strong><em>facturación ÷ inversión · solo pauta ${xf(x.roas_paid)}</em></div>
 <div><span>Costo por venta</span><strong>${x.cpv?usd(x.cpv):'—'}</strong><em>inversión ÷ ventas por pauta</em></div></div>
 ${x.cuello?`<div class="s" style="margin-top:14px">Cuello de botella hoy: <strong style="color:var(--lime)">${x.cuello}</strong></div>`:''}</div>`;
 const wk=p=>`<tr><td><span class="dot" style="display:inline-block;background:${COL[p]};margin-right:8px"></span>${p}</td>${a.sem.map(w=>{const v=w[p];return `<td>${v.gasto!=null?usd(v.gasto):'—'}<div class="s">${v.agendas_meta??'—'} agendas · ${pctf(v.showup)} show-up</div></td>`}).join('')}</tr>`;
 return `<section><h2>Pauta y embudo · ${d.mes}</h2><div class="g2">${a.progs.map(card).join('')}</div></section>
 <section><h2>Inversión y agendas por semana</h2><div class="c tw"><table><thead><tr><th>Programa</th>${a.sem.map(w=>`<th>${w.r}${w.parcial?' (en curso)':''}</th>`).join('')}</tr></thead><tbody>${d.P.map(wk).join('')}</tbody></table></div></section>
 <section><h2>Meses cerrados · vertical de ventas</h2><div class="c tw"><table><thead><tr><th>Mes</th><th>Facturación</th><th>Ventas</th><th>Inversión Meta</th><th>ROAS</th><th>Costo por venta (pauta)</th></tr></thead><tbody>
 ${a.meses.map(m=>`<tr><td>${['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m.m.slice(5)]} ${m.m.slice(0,4)}</td><td>${usd(m.ingreso)}</td><td>${m.ventas}</td><td>${usd(m.gasto)}</td><td>${xf(m.roas_total)}</td><td>${usd(m.costo_venta_paid)}</td></tr>`).join('')}
 </tbody></table><p class="s" style="margin-top:12px">Incluye AI Sales, Sales Machine y Ventas con LinkedIn (cuenta de Meta «Sales | Verticals»).</p></div></section>`;}
function render(d){
 const pc=x=>`<div class="c"><div class="pn"><span class="dot" style="background:${COL[x.p]}"></span>${x.p}</div>
  <div class="big">${usd(x.vendido)}<small>${x.pct.toFixed(1).replace('.',',')}% de ${usd(x.meta)}</small></div>
  <div class="bar"><i style="width:${Math.min(x.pct,100)}%;background:${COL[x.p]}"></i><b style="left:${Math.min(100,(31-d.quedan)/30*100)}%"></b></div>
  <div class="s">La línea marca dónde deberíamos ir hoy para llegar a la meta.</div>
  <div class="kv"><div><span>Falta</span><strong>${usd(x.falta)}</strong><em>${d.quedan} días que quedan</em></div>
  <div><span>Ritmo necesario</span><strong>${usd(x.ritmo)}</strong><em>por día</em></div>
  <div><span>Ventas</span><strong>${x.ventas}</strong><em>ticket promedio ${usd(x.ticket)}</em></div>
  <div><span>Proyección al cierre</span><strong class="${x.proy>=x.meta?'up':''}">${usd(x.proy)}</strong><em>al ritmo hasta ayer</em></div>
  <div><span>Cobrado</span><strong>${usd(x.cobrado)}</strong><em>${x.parciales} en pago parcial</em></div></div></div>`;
 const fecha=d.fecha.charAt(0).toUpperCase()+d.fecha.slice(1);
 return `<header><div><div class="k">Reporte diario · AI Sales y Sales Machine</div>
 <h1>${d.mes.charAt(0).toUpperCase()+d.mes.slice(1)} va en <em>${d.tot.pct.toFixed(0)}%</em> de la meta.</h1>
 <p class="sub">${fecha} · ${usd(d.tot.vendido)} de ${usd(d.tot.meta)} · actualizado ${d.act}</p></div>
 <svg class="logo" viewBox="0 0 261 90"><use href="#logo30x"/></svg></header>
 <section><h2>Meta del mes por programa</h2><div class="g2">${d.progs.map(pc).join('')}</div></section>
 <section><div class="g3">
 <div class="c st hl"><span>Ayer · ${d.ayer.l}</span><b>${usd(d.ayer.usd)}</b><div class="s">${d.ayer.ventas} ventas · ${d.P.map(p=>p+' '+usd(d.ayer.por[p])).join(' · ')}</div></div>
 <div class="c st"><span>Hoy hasta ahora</span><b>${usd(d.hoy.usd)}</b><div class="s">${d.hoy.ventas} ventas</div></div>
 <div class="c st"><span>Proyección total</span><b class="${d.tot.proy>=d.tot.meta?'up':''}">${usd(d.tot.proy)}</b><div class="s">${(d.tot.proy/d.tot.meta*100).toFixed(0)}% de ${usd(d.tot.meta)} al ritmo actual</div></div>
 </div></section>
 <section><h2>Facturación día a día · ${d.mes}</h2><div class="c"><div class="leg">${d.P.map(p=>`<span><i class="dot" style="background:${COL[p]}"></i>${p}</span>`).join('')}</div><div class="chart">${chart(d)}</div></div></section>
 ${d.ads?adsSec(d):''}
 <section><h2>Semana en curso</h2><div class="c tw"><table><thead><tr><th>Día</th><th>Ventas</th>${d.P.map(p=>`<th>${p}</th>`).join('')}<th>Total</th></tr></thead><tbody>
 ${d.semana.map(x=>`<tr class="${x.fut?'fut':''}"><td>${x.d}</td><td>${x.fut?'—':x.ventas}</td>${d.P.map(p=>`<td>${x.fut?'—':usd(x.por[p])}</td>`).join('')}<td><strong>${x.fut?'—':usd(x.usd)}</strong></td></tr>`).join('')}
 </tbody></table></div></section>
 <section><h2>Últimas 8 semanas cerradas</h2><div class="c tw"><table><thead><tr><th>Semana</th><th>Ventas</th>${d.P.map(p=>`<th>${p}</th>`).join('')}<th>Total</th><th>vs. anterior</th></tr></thead><tbody>
 ${d.sem8.map(x=>`<tr><td>${x.r}</td><td>${x.ventas}</td>${d.P.map(p=>`<td>${usd(x[p])}</td>`).join('')}<td><strong>${usd(x.usd)}</strong></td><td class="${x.var==null?'':x.var>=0?'up':'dn'}">${x.var==null?'—':(x.var>=0?'+':'')+x.var.toFixed(0)+'%'}</td></tr>`).join('')}
 </tbody></table></div></section>
 <section><h2>Por closer · ${d.mes}</h2><div class="c tw"><table><thead><tr><th>Closer</th><th>Ventas</th>${d.P.map(p=>`<th>${p}</th>`).join('')}<th>Total</th></tr></thead><tbody>
 ${d.closers.map(x=>`<tr><td>${x.c}</td><td>${x.ventas}</td>${d.P.map(p=>`<td>${usd(x[p])}</td>`).join('')}<td><strong>${usd(x.usd)}</strong></td></tr>`).join('')}
 </tbody></table></div></section>
 <section><h2>Aclaraciones</h2><ul class="acl">${d.acl.map(x=>`<li>${x}</li>`).join('')}</ul></section>
 <p class="foot">Facturación = valor de los negocios ganados en HubSpot con fecha de cierre en el mes (pago completo o parcial), sin cortesías. El programa se toma del nombre del negocio. Semanas de lunes a domingo, hora Colombia. Pauta, agendas y show-up: Meta Ads y HubSpot, del reporte de ads de las 7:00 (${d.ads?d.ads.fuente:'sin datos'}).</p>`;}
</script></body></html>
