<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Reporte de ventas · 30X</title>
<meta property="og:title" content="Reporte diario de ventas · 30X"><meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Tokens Monet (marca_tokens). Modo oscuro: Black Potencia de fondo y Amarillo X como firma. */
:root{
 --potencia:#000000;      /* color.marca.black-potencia: fondo */
 --negro:#0A0A0A;         /* color.neutro.negro: superficies de card */
 --n1:#222222;            /* tinte-negro-paso1: bordes y filas */
 --n2:#363636;            /* tinte-negro-paso2: pista de barras */
 --n3:#6D6D6D;            /* tinte-negro-paso3: pauta en barras */
 --n4:#797979;            /* tinte-negro-paso4: texto terciario */
 --g20:#C5C6C7;           /* tinte-gris-negro20: texto secundario */
 --fg:#F1F1F1;            /* color.marca.gris-net: texto principal sobre oscuro */
 --x:#E9FF7B;             /* color.marca.amarillo-x: acento y dato */
 --beige:#DDD4C0;         /* color.marca.beige-crecimiento */
 --sm:#B4AE9D;            /* tinte-beige-negro20: Sales Machine */
 --ink:#1A1A1A;           /* color.neutro.casi-negro: texto sobre Amarillo X */
 --r-sm:8px;--r-md:12px;--r-lg:16px;--r-full:9999px;
 --seccion:80px;          /* espaciado.seccion (80 a 120px) entre bloques */
 color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--potencia);color:var(--fg);font-family:Inter,Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:500;font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* Escala tipográfica Monet */
.cap{font-size:12px;font-weight:500;letter-spacing:0;line-height:1.4;color:var(--n4)}           /* caption */
.lbl{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4;color:var(--g20)}     /* label */
.sml{font-size:14px;font-weight:500;letter-spacing:-.01em;line-height:1.5;color:var(--g20)}     /* small */
h1{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15}                     /* display-md */
h2{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3;color:var(--fg)}        /* card */
.blk{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--x);margin-bottom:16px}  /* Amarillo X como tinta sobre negro */
.hero{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1.05}                    /* hero */
.dmd{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15;white-space:nowrap}                    /* display-md */
.v18{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}                      /* card */

/* Encabezado */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
svg.logo{height:24px;width:70px;display:block;margin-top:4px;flex:none;fill:#F2F2F2} /* color.neutro.logo-claro */
.fresh{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;line-height:1.4;color:var(--g20);background:var(--negro);border:1px solid var(--n1);border-radius:var(--r-full);padding:6px 12px}
.pill b{font-weight:600;color:var(--fg)}
.pill i{width:6px;height:6px;border-radius:var(--r-full);background:var(--x);flex:none}

/* Estructura */
.bloque{margin-top:var(--seccion)}
.bloque.first{margin-top:40px}
section{margin-top:40px}
.bloque>section:first-of-type{margin-top:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.c{background:var(--negro);border:1px solid var(--n1);border-radius:var(--r-md);padding:20px}
.c.lg{border-radius:var(--r-lg)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}}
.dot{display:inline-block;width:8px;height:8px;border-radius:var(--r-full);flex:none}

/* Meta por programa */
.prog .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog .name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:-.01em}
.prog .hero{margin-top:12px}
.prog .hero small{font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--g20);margin-left:4px}
.bar{height:10px;background:var(--n2);border-radius:var(--r-full);position:relative;overflow:hidden;margin:16px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full)}
.bar i.proy{opacity:.35}
.legbar{display:flex;flex-wrap:wrap;gap:4px 16px}
.legbar span{display:inline-flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--n1)}
.kv .cap{display:block}
.kv .v18{display:block;margin-top:2px;white-space:nowrap}
details.how{margin-top:16px;border-top:1px solid var(--n1);padding-top:12px}
details.how summary{cursor:pointer;list-style:none;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--fg);display:flex;justify-content:space-between;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";color:var(--n4);font-weight:500;font-size:18px;line-height:1}
details.how[open] summary::after{content:"−"}

/* Semáforo: lleno en Amarillo X = bien; contorno = por debajo. Siempre con flecha y texto, no solo color. */
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.4;border-radius:var(--r-full);padding:4px 10px;white-space:nowrap}
.sem.ok{background:var(--x);color:var(--ink)}
.sem.no{background:transparent;color:var(--beige);border:1px solid var(--beige)}
.up{color:var(--x)}.dn{color:var(--beige)}

/* Filas */
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:12px 0;border-bottom:1px solid var(--n1);font-size:14px;line-height:1.5}
.row>div:last-child{text-align:right;white-space:nowrap;font-weight:600}
.row small{display:block;font-size:12px;font-weight:500;color:var(--n4);margin-top:2px;line-height:1.4}
.row.tot{border-bottom:0;border-top:1px solid var(--n3);font-weight:700;font-size:16px}
.row.flat{border-bottom:0}

/* Datos */
.st .lbl{display:block}
.st .dmd{margin-top:4px}
.st .cap{margin-top:4px}
.st .sem{margin-top:8px}
.st.x{background:var(--x);border-color:var(--x);color:var(--ink)}
.st.x .lbl,.st.x .cap{color:var(--ink)}
.cmp{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.cmp .bar{margin:0}
.note{border-left:2px solid var(--x);background:var(--negro);border-radius:var(--r-sm);padding:12px 16px;font-size:14px;line-height:1.55;color:var(--fg);margin-top:12px}
.note p+p{margin-top:6px;color:var(--g20)}

/* Tablas: solo ellas hacen scroll horizontal; la primera columna queda fija */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
th{text-align:right;font-size:12px;font-weight:600;color:var(--n4);padding:8px 12px;border-bottom:1px solid var(--n1);white-space:nowrap}
td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--n1);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--negro);padding-left:0}
th:last-child,td:last-child{padding-right:0}
tr:last-child td{border-bottom:0}
tr.t td{border-top:1px solid var(--n3);font-weight:700}
.hb{height:6px;background:var(--n2);border-radius:var(--r-full);overflow:hidden;min-width:64px}.hb i{display:block;height:100%;background:var(--x);border-radius:var(--r-full)}

/* Gráfico */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4;background:var(--negro);color:var(--g20);border:1px solid var(--n1);border-radius:var(--r-full);padding:6px 12px;cursor:pointer;transition:background-color 100ms linear,color 100ms linear}
.tab.on{background:var(--x);color:var(--ink);border-color:var(--x)}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 12px}
.leg span{display:inline-flex;align-items:center;gap:6px}
#ch{width:100%}
.wk{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media(max-width:820px){.wk{grid-template-columns:minmax(0,1fr)}}
.foot{margin-top:48px}
#lock{max-width:520px;margin:18vh auto;text-align:center;padding:0 16px}

@media(max-width:420px){.bloque.first{margin-top:32px}.fresh{margin-top:12px}.hero{font-size:60px}h1{font-size:30px}.c{padding:16px}.kv{gap:8px}.tw{margin:0 -16px;padding:0 16px}}
</style></head><body>
