<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Reporte de ventas · 30X</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0A0A0A;--card:#141414;--card2:#1A1A1A;--line:rgba(255,255,255,.09);--fg:#fff;--mut:rgba(255,255,255,.55);--dim:rgba(255,255,255,.32);--lime:#E9FF7B;--sm:#9AA0FF;--red:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left)) 72px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}header>div{min-width:0}
.k{font-weight:600;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
h1{font-weight:600;font-size:clamp(30px,5.4vw,52px);line-height:1.02;letter-spacing:-.04em;margin-top:14px;max-width:18ch}
h1 em{font-style:normal;color:var(--lime)}
.sub{color:var(--mut);font-size:14px;margin-top:12px}
svg.logo{width:86px;height:30px;fill:#fff}
section{margin-top:36px}
h2{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.pn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%}
.big{font-size:40px;font-weight:600;letter-spacing:-.035em;margin-top:14px}
.big small{font-size:15px;color:var(--mut);font-weight:500;letter-spacing:0;margin-left:6px}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:99px;margin:14px 0 4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.55)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:16px}
.kv div span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kv div strong{display:block;font-size:18px;font-weight:600;margin-top:4px}
.kv div em{font-style:normal;font-size:12px;color:var(--dim)}
.s{font-size:12.5px;color:var(--mut)}
.hl{border-color:rgba(233,255,123,.35)}
.st b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:8px}
.st span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.chart{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{text-align:right;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{white-space:nowrap;text-align:right;padding:11px 12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.fut td{color:var(--dim)}
.tw{overflow-x:auto}
.up{color:var(--lime)}.dn{color:var(--red)}
.leg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-bottom:10px;flex-wrap:wrap}
.leg span{display:flex;align-items:center;gap:6px}
ul.acl{list-style:none;padding:0;display:grid;gap:10px}
ul.acl li{background:var(--card2);border-left:2px solid var(--lime);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.85)}
.foot{color:var(--dim);font-size:12px;margin-top:28px;line-height:1.6}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:7px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.row.tot{border-top:1px solid rgba(255,255,255,.5);border-bottom:0;font-weight:600}
.note{background:rgba(233,255,123,.08);border:1px solid rgba(233,255,123,.25);color:#F4FFC0;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-top:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-size:12.5px;background:var(--card2);color:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:99px;padding:7px 13px;cursor:pointer}
.tab.on{background:var(--lime);color:#000;border-color:var(--lime);font-weight:600}
.wk{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media(max-width:820px){.wk{grid-template-columns:1fr}}
.prog2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.hb{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;min-width:80px}.hb i{display:block;height:100%;background:var(--lime)}
#lock{max-width:520px;margin:18vh auto;text-align:center;color:var(--mut);padding:0 16px}
</style></head><body>

let D;
(async()=>{try{
 const k=new URLSearchParams(location.hash.slice(1)).get('k'); if(!k) return;
 const raw=b64(P),key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
 D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12))));
 document.getElementById('lock').hidden=true; const a=document.getElementById('app'); a.hidden=false; a.innerHTML=render(D); setTab('gasto');
}catch(e){document.querySelector('#lock p').textContent='El link no es válido o está incompleto.';console.error(e)}})();
const MET={gasto:['Inversión',v=>usd(v)],registros:['Registros',v=>v],agendas:['Agendas (ads)',v=>v],cpa:['Costo por agenda',v=>usd(v)],reuniones:['Reuniones programadas',v=>v],tomadas:['Sesiones tomadas',v=>v]};
function val(r,p,m){const x=r[p];return m==='cpa'?(x.agendas?x.gasto/x.agendas:0):x[m]}
function setTab(m){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 const rows=D.ads_dia, W=980,H=230,pb=34,pt=18,n=rows.length,bw=W/Math.max(n,1);
 const tot=r=>m==='cpa'?(()=>{const g=D.P.reduce((s,p)=>s+r[p].gasto,0),a=D.P.reduce((s,p)=>s+r[p].agendas,0);return a?g/a:0})():D.P.reduce((s,p)=>s+val(r,p,m),0);
 const mx=Math.max(1,...rows.map(tot)); const y=v=>H-pb-(v/mx)*(H-pb-pt); let s='';
 rows.forEach((r,i)=>{const cx=i*bw+bw*.2,w=bw*.6; let acc=0;
  if(m==='cpa'){const v=tot(r); if(v>0)s+=`<rect x="${cx}" y="${y(v)}" width="${w}" height="${H-pb-y(v)}" rx="3" fill="var(--lime)"/>`; acc=v}
  else D.P.forEach(p=>{const v=val(r,p,m); if(v>0)s+=`<rect x="${cx}" y="${y(acc+v)}" width="${w}" height="${y(acc)-y(acc+v)}" rx="3" fill="${COL[p]}"/>`; acc+=v});
  if(acc>0)s+=`<text x="${cx+w/2}" y="${y(acc)-5}" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,.75)">${m==='gasto'||m==='cpa'?k0(acc):Math.round(acc)}</text>`;
  s+=`<text x="${cx+w/2}" y="${H-18}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.65)">${r.d}</text><text x="${cx+w/2}" y="${H-5}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,.3)">${r.w}</text>`});
 document.getElementById('ch').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block">${s}</svg>`;
 document.getElementById('cht').textContent=MET[m][0]+' · día a día · '+D.mes;}
function render(d){

 <section><div class="c"><div class="k" style="color:var(--mut)">Facturación vs pauta · ${d.mes} · USD</div>
 <div class="g3" style="margin-top:14px">${[['Facturación',usd(ti),'Vendido 1 al '+hoyN+'-'+d.mes.slice(0,3)+' · HubSpot'],['Inversión en pauta',usd(tg),'Meta Ads 1 al '+(hoyN-1)+'-'+d.mes.slice(0,3)],['ROAS',xf(tg?ti/tg:null),'facturación ÷ inversión']].map(([l,v,s])=>`<div><div class="kv" style="margin:0;grid-template-columns:1fr"><div><span>${l}</span><strong style="font-size:26px">${v}</strong><em>${s}</em></div></div></div>`).join('')}</div>
 <div style="margin-top:18px;display:grid;gap:10px">${[['Facturación',ti,'var(--lime)'],['Pauta',tg,'var(--red)']].map(([l,v,c])=>`<div style="display:grid;grid-template-columns:90px 1fr 120px;gap:12px;align-items:center;font-size:13.5px"><span>${l}</span><div class="bar" style="margin:0;height:10px"><i style="width:${v/mxb*100}%;background:${c}"></i></div><span style="text-align:right">${usd(v)}</span></div>`).join('')}</div>
 <div style="margin-top:14px">${fp.map(x=>`<div class="row"><div><span class="dot" style="display:inline-block;background:${COL[x.p]};margin-right:8px"></span>${x.p}<small>facturación ${usd(x.ing)}</small></div><div>pauta ${usd(x.g)} · ROAS ${xf(x.g?x.ing/x.g:null)}</div></div>`).join('')}</div>
 <p class="s" style="margin-top:12px">Cómo se mide: facturación = valor de los negocios ganados en HubSpot con cierre en el mes (pago completo o parcial), sin cortesías. Pauta = inversión en Meta de las campañas de cada programa. No incluye comisiones ni herramientas.</p></div></section>

 ${ay?`<section><div class="c"><div class="k" style="color:var(--mut)">Pauta del día · ${ay.d}-${d.mes.slice(0,3)} · USD</div>
 ${d.P.map(p=>`<div class="row"><div>${p}<small>${ay[p].agendas} agendas · ${ay[p].registros} registros</small></div><div>${usd(ay[p].gasto)}</div></div>`).join('')}
 <div class="row tot"><div>Total</div><div>${usd(d.P.reduce((s,p)=>s+ay[p].gasto,0))}</div></div></div></section>`:''}

 <section><h2>${mesC} · ventas al ${hoyN}-${d.mes.slice(0,3)}</h2><div class="g2">
 <div class="c st"><span>Ventas totales</span><b>${usd(d.tot.vendido)}</b><div class="s">${d.tot.ventas} ventas cerradas · ${d.progs.map(x=>x.p+' '+usd(x.vendido)).join(' · ')}</div></div>
 <div class="c st" style="background:var(--lime);color:#000;border-color:var(--lime)"><span style="color:rgba(0,0,0,.6)">Ventas del día · ${hoyN}-${d.mes.slice(0,3)}</span><b>${usd(d.hoy.usd)}</b><div class="s" style="color:rgba(0,0,0,.65)">${d.hoy.ventas} ${d.hoy.ventas===1?'venta cerrada':'ventas cerradas'}</div></div></div>
 <div class="note">El ${d.ayer.l} cerró en ${usd(d.ayer.usd)} (${d.ayer.ventas} ${d.ayer.ventas===1?'venta':'ventas'}). Hoy va en ${usd(d.hoy.usd)}; el total se ajusta mañana con los pagos que entren.${d.acl.length?'<br>'+d.acl.join('<br>'):''}</div></section>

 <section><div class="g3">${[['Venta automática · '+d.mes,d.auto.mes,''],['Venta automática · semana',d.auto.semana,''],['Venta automática · '+d.auto.mes_ant,d.auto.ant,'mes cerrado']].map(([l,a,s])=>`<div class="c st"><span>${l}</span><b style="color:var(--lime)">${a.n?(a.auto/a.n*100).toFixed(1).replace('.',',')+'%':'—'}</b><div class="s">${a.auto} ${a.auto===1?'venta automática':'ventas automáticas'} de ${a.n} en total${a.auto?' · '+usd(a.usd):''}${s?' · '+s:''}</div></div>`).join('')}</div>
 <p class="s" style="margin-top:10px">Venta automática = compró alguien que se inscribió antes al workshop gratis «Salva tus ventas» (${d.auto.inscritos.toLocaleString('es-CO')} inscritos en form30x). ${d.auto.mes.quien.length?'Este mes: '+d.auto.mes.quien.join(', ')+'.':''}</p></section>

 <section><div class="c tw"><div class="k" style="color:var(--mut);margin-bottom:12px">Ventas por programa y cohorte · ${d.mes}</div><table><thead><tr><th>Programa · cohorte</th><th>Ventas</th><th>Vendido USD</th><th>Peso</th></tr></thead><tbody>
 ${d.cohortes.map(c=>`<tr><td><span class="dot" style="display:inline-block;background:${COL[c.p]};margin-right:8px"></span>${c.p} · ${c.c}</td><td>${c.ventas}</td><td>${usd(c.usd)}</td><td><div class="hb" style="margin-left:auto;width:120px"><i style="width:${c.usd/d.tot.vendido*100}%"></i></div></td></tr>`).join('')}
 <tr><td><strong>Total</strong></td><td><strong>${d.tot.ventas}</strong></td><td><strong>${usd(d.tot.vendido)}</strong></td><td></td></tr></tbody></table></div></section>

 <section><h2>${mesC} · ads del 1 al ${hoyN-1}-${d.mes.slice(0,3)}</h2><div class="g3">
 ${st('Inversión',usd(gT),d.P.map(p=>p+' '+usd(A[p].gasto)).join(' · '),'hl')}
 ${st('Registros',sumA('registros'),'negocios nuevos en HubSpot')}
 ${st('Agendas (ads)',agT,d.P.map(p=>p+' '+A[p].agendas).join(' · '))}
 ${st('Costo por agenda',agT?usd(gT/agT):'—','inversión ÷ agendas del mes')}
 ${st('Reuniones programadas',sumA('reuniones'),d.P.map(p=>p+' '+A[p].reuniones).join(' · '))}
 ${st('Sesiones tomadas',sumA('tomadas'),'show-up '+(sumA('reuniones')?Math.round(sumA('tomadas')/sumA('reuniones')*100)+'%':'—'))}
 ${st('ROAS del mes',xf(gT?d.tot.vendido/gT:null),usd(d.tot.vendido)+' de facturación ÷ '+usd(gT)+' de inversión')}
 ${st('CAC del mes',d.tot.ventas?usd(gT/d.tot.ventas):'—',usd(gT)+' de inversión ÷ '+d.tot.ventas+' ventas')}
 </div></section>

 <section><div class="c"><div class="tabs">${Object.entries(MET).map(([k,v])=>`<button class="tab" data-m="${k}" onclick="setTab('${k}')">${v[0]}</button>`).join('')}</div>
 <h3 id="cht" style="font-size:16px;margin-bottom:10px"></h3><div class="leg">${d.P.map(p=>`<span><i class="dot" style="background:${COL[p]}"></i>${p}</span>`).join('')}</div><div class="chart" id="ch"></div></div></section>

 <section><h2>Semana en curso</h2><div class="wk">
 <div class="c tw"><h3 style="font-size:14px;margin-bottom:10px">Ads · últimos ${u7.length} días con datos</h3><table style="min-width:600px"><thead><tr><th>Métrica</th>${u7.map(r=>`<th>${r.lab}</th>`).join('')}</tr></thead><tbody>
 ${met.map(([l,k,f])=>`<tr><td>${l}</td>${u7.map(r=>`<td>${fmtCell(r,k,f)}</td>`).join('')}</tr>`).join('')}</tbody></table>
 <p class="s" style="margin-top:10px">Semana pasada (${s8[s8.length-1].r}), cerrada: ${usd(s8[s8.length-1].usd)} · ${s8[s8.length-1].ventas} ventas</p></div>
 <div class="c"><div class="k" style="color:var(--mut)">Total de ventas cerradas de la semana</div><div class="big" style="margin-top:8px">${usd(d.semana.reduce((s,x)=>s+(x.fut?0:x.usd),0))}</div>
 <div class="k" style="color:var(--mut);margin-top:16px">Total de cupos vendidos de la semana</div><div class="big" style="margin-top:8px">${d.semana.reduce((s,x)=>s+(x.fut?0:x.ventas),0)}</div>
 <div style="margin-top:12px">${d.semana.filter(x=>!x.fut).map(x=>`<div class="row"><div>${x.d}<small>${x.ventas} ventas</small></div><div>${usd(x.usd)}</div></div>`).join('')}</div></div></div></section>

 <section><div class="c tw"><div class="k" style="color:var(--mut)">Ventas de las últimas 8 semanas · USD</div><p class="s" style="margin:6px 0 12px">Lunes a domingo · HubSpot · promedio de las 8 semanas: ${usd(s8.reduce((s,x)=>s+x.usd,0)/s8.length)}</p>
 <table><thead><tr><th>Semana</th><th>Ventas USD</th><th>Cupos</th><th>vs. semana anterior</th><th></th></tr></thead><tbody>
 ${s8.map(x=>`<tr><td>${x.r}</td><td>${usd(x.usd)}</td><td>${x.ventas}</td><td class="${x.var==null?'':x.var>=0?'up':'dn'}">${x.var==null?'—':(x.var>=0?'+':'')+x.var.toFixed(1).replace('.',',')+'%'}</td><td><div class="hb" style="width:160px;margin-left:auto"><i style="width:${x.usd/mx8*100}%"></i></div></td></tr>`).join('')}
 <tr><td><strong>Total 8 semanas</strong></td><td><strong>${usd(s8.reduce((s,x)=>s+x.usd,0))}</strong></td><td><strong>${s8.reduce((s,x)=>s+x.ventas,0)}</strong></td><td></td><td></td></tr></tbody></table></div></section>

 <section><div class="c tw"><div class="k" style="color:var(--mut);margin-bottom:12px">Meses cerrados · USD</div><table><thead><tr><th>Mes</th><th>Facturación</th>${d.P.map(p=>`<th>${p}</th>`).join('')}<th>Ventas</th><th>Inversión Meta</th><th>ROAS</th><th>CAC</th></tr></thead><tbody>
 ${d.meses.map(m=>`<tr><td>${m.m}</td><td>${usd(m.usd)}</td>${d.P.map(p=>`<td>${usd(m[p])}</td>`).join('')}<td>${m.ventas}</td><td>${m.gasto?usd(m.gasto):'—'}</td><td>${m.gasto?xf(m.roas):'—'}</td><td>${m.gasto?usd(m.cac):'—'}</td></tr>`).join('')}</tbody></table></div></section>

 <section><div class="c tw"><div class="k" style="color:var(--mut);margin-bottom:12px">Por closer · ${d.mes}</div><table><thead><tr><th>Closer</th><th>Ventas</th>${d.P.map(p=>`<th>${p}</th>`).join('')}<th>Total</th></tr></thead><tbody>
 ${d.closers.map(x=>`<tr><td>${x.c}</td><td>${x.ventas}</td>${d.P.map(p=>`<td>${usd(x[p])}</td>`).join('')}<td><strong>${usd(x.usd)}</strong></td></tr>`).join('')}</tbody></table></div></section>
 <p class="foot">Fuentes: HubSpot (ventas, registros), Meta Ads cuenta «Sales | Verticals» (inversión y agendas por nombre de campaña), reuniones y show-up del reporte de ads de las 7:00. Hora Colombia. Actualizado ${d.act}.</p>`;}
